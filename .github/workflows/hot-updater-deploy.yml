name: OTA Deploy (Hot Updater)

on:
  push:
    branches:
      - main

concurrency:
  group: hot-updater-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy OTA Bundle
    runs-on: ubuntu-latest
    # As variáveis EXPO_PUBLIC_* são environment secrets deste ambiente e só
    # ficam acessíveis ao job que o declara.
    environment: PROD

    # Variáveis EXPO_PUBLIC_* são embutidas no bundle em build time. O runner não
    # tem o .env.local (gitignored) e o Expo ignora .env.local quando CI=true,
    # portanto elas precisam vir do ambiente ou o bundle sobe sem configuração.
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_STRAPI_URL: ${{ secrets.EXPO_PUBLIC_STRAPI_URL }}
      EXPO_PUBLIC_STRAPI_TOKEN: ${{ secrets.EXPO_PUBLIC_STRAPI_TOKEN }}
      EXPO_PUBLIC_HOT_UPDATER_URL: ${{ secrets.EXPO_PUBLIC_HOT_UPDATER_URL }}

    steps:
      # Um bundle publicado sem essas variáveis quebra na inicialização do app e
      # é revertido pelo hot-updater, então falhar aqui é mais barato.
      - name: Validate required environment variables
        run: |
          missing=""
          for var in EXPO_PUBLIC_API_URL EXPO_PUBLIC_STRAPI_URL EXPO_PUBLIC_STRAPI_TOKEN EXPO_PUBLIC_HOT_UPDATER_URL; do
            [ -z "${!var}" ] && missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase-adminsdk-credentials.json

      - name: Write bundle signing key
        env:
          HOT_UPDATER_PRIVATE_KEY: ${{ secrets.HOT_UPDATER_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$HOT_UPDATER_PRIVATE_KEY_BASE64" ]; then
            echo "::error::Secret ausente: HOT_UPDATER_PRIVATE_KEY_BASE64"
            exit 1
          fi
          mkdir -p keys
          printf '%s\n' "$HOT_UPDATER_PRIVATE_KEY" > keys/private-key.pem
          chmod 600 keys/private-key.pem

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(npx expo config --type public --json | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))
          ")
          if [ -z "$VERSION" ]; then
            echo "::error::Não foi possível ler a versão do app.config.js"
            exit 1
          fi
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy iOS (Hot Updater)
        env:
          HOT_UPDATER_FIREBASE_PROJECT_ID: ${{ secrets.HOT_UPDATER_FIREBASE_PROJECT_ID }}
          HOT_UPDATER_FIREBASE_STORAGE_BUCKET: ${{ secrets.HOT_UPDATER_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-adminsdk-credentials.json
        run: |
          yarn hot-updater deploy \
            --platform ios \
            --channel production \
            --target-app-version ${{ steps.app_version.outputs.value }} \
            --message "${{ github.event.head_commit.message }}"

      - name: Deploy Android (Hot Updater)
        env:
          HOT_UPDATER_FIREBASE_PROJECT_ID: ${{ secrets.HOT_UPDATER_FIREBASE_PROJECT_ID }}
          HOT_UPDATER_FIREBASE_STORAGE_BUCKET: ${{ secrets.HOT_UPDATER_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-adminsdk-credentials.json
        run: |
          yarn hot-updater deploy \
            --platform android \
            --channel production \
            --target-app-version ${{ steps.app_version.outputs.value }} \
            --message "${{ github.event.head_commit.message }}"

      - name: Cleanup credentials
        if: always()
        run: rm -f firebase-adminsdk-credentials.json keys/private-key.pem
